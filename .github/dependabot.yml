# One weekly pull request for every ecosystem in this repository.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"

  - package-ecosystem: "terraform"
    directories: ["/*"]
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
