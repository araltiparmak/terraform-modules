name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token; this workflow never talks to AWS.
permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
      - name: Format check
        run: terraform fmt -recursive -check
      - name: Validate and test
        run: |
          for m in */; do
            [ -n "$(ls "$m"*.tf 2>/dev/null)" ] || continue
            echo "== $m"
            terraform -chdir="$m" init -backend=false -input=false > /dev/null
            terraform -chdir="$m" validate -no-color
            if [ -d "${m}tests" ]; then
              terraform -chdir="$m" test -no-color
            fi
          done
